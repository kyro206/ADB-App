name: "Compilar y publicar releases de ADB App"

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: "--bundles deb,updater"
            name: "linux-x64"

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: "--bundles appimage,updater"
            name: "appimage-x64"

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis,updater"
            name: "windows-x64"

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            args: "--bundles nsis,updater"
            name: "windows-arm64"

          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--bundles dmg,updater"
            name: "macos-x64"

          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--bundles dmg,updater"
            name: "macos-arm64"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      - name: Sincronizar versiones de Tauri y Cargo con el Tag
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const tag = "${{ github.event.release.tag_name }}";
            const version = tag.replace(/^v/, "");
            
            const tauriPath = "src-tauri/tauri.conf.json";
            if (fs.existsSync(tauriPath)) {
              const config = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
              config.version = version;
              
              fs.writeFileSync(tauriPath, JSON.stringify(config, null, 2));
              console.log("✓ tauri.conf.json sincronizado a la versión: " + version);
            }

            const cargoPath = "src-tauri/Cargo.toml";
            if (fs.existsSync(cargoPath)) {
              let cargoContent = fs.readFileSync(cargoPath, "utf8");
              cargoContent = cargoContent.replace(/^version\s*=\s*"[^"]*"/m, `version = "${version}"`);
              fs.writeFileSync(cargoPath, cargoContent);
              console.log("✓ Cargo.toml sincronizado a la versión: " + version);
            }
          '

      - name: Configurar Rust y el Target de compilación
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Instalar dependencias de Linux (Gtk / WebKit)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias del Frontend
        run: bun install

      - name: Compilar y Subir aplicación con Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.release.tag_name }}
          releaseId: ${{ github.event.release.id }}
          args: --target ${{ matrix.target }} ${{ matrix.args }}

  publish-updater:
    needs: build-tauri
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false
    steps:
      - name: Renombrar Assets y Generar latest.json con Action
        uses: actions/github-script@v7
        with:
          script: |
            const { repo, owner } = context.repo;
            const release = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag: context.payload.release.tag_name
            });

            const version = release.data.tag_name.replace(/^v/, '');
            const assets = release.data.assets;
            const newAssets = [];

            // 1. Renombrar assets con la API para aplicar la arquitectura
            for (const asset of assets) {
              let newName = asset.name;
              const isSig = newName.endsWith('.sig');
              const baseName = isSig ? newName.slice(0, -4) : newName;
              const lowerBase = baseName.toLowerCase();

              let platformType = '';
              
              if (lowerBase.includes('windows') || lowerBase.includes('nsis') || lowerBase.endsWith('.exe')) {
                if (lowerBase.includes('arm64') || lowerBase.includes('aarch64')) {
                  platformType = 'arm64.exe';
                } else {
                  platformType = 'x64.exe';
                }
              } else if (lowerBase.endsWith('.dmg')) {
                if (lowerBase.includes('arm64') || lowerBase.includes('aarch64')) {
                  platformType = 'silicon.dmg';
                } else {
                  platformType = 'intel.dmg';
                }
              } else if (lowerBase.endsWith('.appimage')) {
                platformType = 'x64.AppImage';
              } else if (lowerBase.endsWith('.deb')) {
                platformType = 'x64.deb';
              }

              if (platformType) {
                const finalNewName = `ADB.App_${version}_${platformType}${isSig ? '.sig' : ''}`;
                if (finalNewName !== asset.name) {
                  console.log(`Renombrando ${asset.name} -> ${finalNewName}`);
                  await github.rest.repos.updateReleaseAsset({
                    owner,
                    repo,
                    asset_id: asset.id,
                    name: finalNewName
                  });
                  newName = finalNewName;
                }
              }
              const newUrl = asset.browser_download_url.substring(0, asset.browser_download_url.lastIndexOf('/') + 1) + newName;
              newAssets.push({ ...asset, name: newName, browser_download_url: newUrl });
            }

            // 2. Generar latest.json
            const platforms = {};
            for (const asset of newAssets) {
              if (asset.name.endsWith('.sig') || asset.name === 'latest.json') continue;
              
              const sigAsset = newAssets.find(a => a.name === asset.name + '.sig');
              if (!sigAsset) {
                console.warn(`No signature found for ${asset.name}`);
                continue;
              }
              
              // Descargar firma
              const sigResponse = await fetch(sigAsset.browser_download_url);
              if (!sigResponse.ok) {
                console.warn(`Failed to fetch signature for ${asset.name}`);
                continue;
              }
              const signature = (await sigResponse.text()).trim();

              const lowerName = asset.name.toLowerCase();
              let platformKey = null;
              if (lowerName.includes('arm64.exe')) platformKey = 'windows-aarch64';
              else if (lowerName.includes('x64.exe')) platformKey = 'windows-x86_64';
              else if (lowerName.includes('silicon.dmg')) platformKey = 'darwin-aarch64';
              else if (lowerName.includes('intel.dmg')) platformKey = 'darwin-x86_64';
              else if (lowerName.includes('.appimage')) platformKey = 'linux-x86_64';
              
              if (platformKey) {
                platforms[platformKey] = {
                  signature,
                  url: asset.browser_download_url
                };
              }
            }

            const latestJson = {
              version,
              notes: release.data.body || "Nueva actualización disponible.",
              pub_date: new Date().toISOString(),
              platforms
            };

            const fs = require('fs');
            fs.writeFileSync('latest.json', JSON.stringify(latestJson, null, 2));
            console.log("latest.json generado exitosamente:");
            console.log(JSON.stringify(latestJson, null, 2));

      - name: Desplegar latest.json en la rama gh-pages
        run: |
          git clone --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages-repo
          cp latest.json gh-pages-repo/latest.json
          cd gh-pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Actualizar updater endpoint para la versión ${{ github.event.release.tag_name }}"
          git push origin gh-pages