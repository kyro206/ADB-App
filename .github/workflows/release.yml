name: "Compilar y publicar releases de ADB App"

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Sincronizar versiones
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          
          # Actualizar package.json
          bun pm version $VERSION --no-git-tag-version
          
          # Actualizar Cargo.toml y tauri.conf.json rápidamente
          node -e '
            const fs = require("fs");
            const version = "'"$VERSION"'";
            
            // tauri.conf.json
            let tauriConf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            tauriConf.version = version;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(tauriConf, null, 2));
            
            // Cargo.toml
            let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            cargo = cargo.replace(/^version\s*=\s*"[^"]*"/m, `version = "${version}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);
          '

      - name: Subir código modificado
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: |
            .
            !.git
            !node_modules
            !src-tauri/target
          include-hidden-files: true

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: "--bundles deb,appimage,updater"
            name: "linux-x64"

          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--bundles dmg,updater"
            name: "macos-x64"

          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--bundles dmg,updater"
            name: "macos-arm64"

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis,updater"
            name: "windows-x64"

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            args: "--bundles nsis,updater"
            name: "windows-arm64"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Descargar código fuente modificado
        uses: actions/download-artifact@v4
        with:
          name: source-code

      - name: Configurar Rust y el Target de compilación
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cachear dependencias de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Instalar dependencias de Linux (Gtk / WebKit)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias del Frontend
        run: bun install

      - name: Compilar y Subir aplicación con Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.event.release.tag_name }}
          releaseId: ${{ github.event.release.id }}
          args: --target ${{ matrix.target }} ${{ matrix.args }}
          updaterJsonPreferNsis: true
          updaterJsonKeepUniversalMacos: true

  publish-updater:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      - name: Generar latest.json y actualizar Release
        uses: actions/github-script@v7
        with:
          script: |
            const { repo, owner } = context.repo;
            const release = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag: context.payload.release.tag_name
            });

            const version = release.data.tag_name.replace(/^v/, '');
            const assets = release.data.assets;
            
            // 1. Pre-fetch de las firmas (.sig)
            const signatureCache = new Map();
            for (const asset of assets) {
              if (asset.name.endsWith('.sig')) {
                const sigResponse = await fetch(asset.browser_download_url);
                if (sigResponse.ok) {
                  signatureCache.set(asset.name, (await sigResponse.text()).trim());
                } else {
                  console.warn(`Error al descargar firma original: ${asset.name}`);
                }
              }
            }

            const platforms = {};
            const downloads = {
              Windows: [],
              macOS: [],
              Linux: []
            };

            for (const asset of assets) {
              if (asset.name.endsWith('.sig') || asset.name === 'latest.json') continue;
              
              const lowerName = asset.name.toLowerCase();
              let platformKey = null;

              if (lowerName.endsWith('.exe')) {
                if (lowerName.includes('arm64') || lowerName.includes('aarch64')) {
                  platformKey = 'windows-aarch64';
                  downloads.Windows.push(`[ARM64 (.exe)](${asset.browser_download_url})`);
                } else {
                  platformKey = 'windows-x86_64';
                  downloads.Windows.push(`[x64 (.exe)](${asset.browser_download_url})`);
                }
              } else if (lowerName.endsWith('.dmg')) {
                if (lowerName.includes('arm64') || lowerName.includes('aarch64')) {
                  platformKey = 'darwin-aarch64';
                  downloads.macOS.push(`[Apple Silicon (.dmg)](${asset.browser_download_url})`);
                } else {
                  platformKey = 'darwin-x86_64';
                  downloads.macOS.push(`[Intel (.dmg)](${asset.browser_download_url})`);
                }
              } else if (lowerName.endsWith('.appimage')) {
                platformKey = 'linux-x86_64';
                downloads.Linux.push(`[x64 (.AppImage)](${asset.browser_download_url})`);
              } else if (lowerName.endsWith('.deb')) {
                downloads.Linux.push(`[x64 (.deb)](${asset.browser_download_url})`);
              }
              
              if (!platformKey) continue;
              
              const sigName = asset.name + '.sig';
              let signature = signatureCache.get(sigName) || "";
              
              if (!signature) {
                core.warning(`No se encontró o no se pudo leer la firma (.sig) para: ${asset.name}`);
              }

              platforms[platformKey] = {
                signature,
                url: asset.browser_download_url
              };
            }

            const latestJson = {
              version,
              notes: release.data.body || "Nueva actualización disponible.",
              pub_date: new Date().toISOString(),
              platforms
            };

            const fs = require('fs');
            fs.writeFileSync('latest.json', JSON.stringify(latestJson, null, 2));

            // 4. Generar lista de descargas y actualizar el Release
            let tableMarkdown = "| Sistema Operativo | Descargas |\n|---|---|\n";
            for (const os of ['Windows', 'macOS', 'Linux']) {
              if (downloads[os].length > 0) {
                tableMarkdown += `| **${os}** | ${downloads[os].join('<br>')} |\n`;
              }
            }
            tableMarkdown += '\n---\n\n';
            
            const originalBody = release.data.body || '';
            const newBody = originalBody.includes('| Sistema Operativo | Descargas |') 
              ? originalBody 
              : tableMarkdown + originalBody;
            
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.data.id,
              body: newBody
            });

      - name: Desplegar latest.json en la rama gh-pages
        run: |
          git clone --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages-repo
          cp latest.json gh-pages-repo/latest.json
          cd gh-pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Actualizar updater endpoint para la versión ${{ github.event.release.tag_name }}"
          git push origin gh-pages