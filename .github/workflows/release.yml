name: "Compilar y publicar releases de ADB App"

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: "--bundles deb,updater"
            name: "linux-x64"

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: "--bundles appimage,updater"
            name: "appimage-x64"

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis,updater"
            name: "windows-x64"

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            args: "--bundles nsis,updater"
            name: "windows-arm64"

          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--bundles dmg,updater"
            name: "macos-x64"

          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--bundles dmg,updater"
            name: "macos-arm64"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      - name: Sincronizar versiones de Tauri y Cargo con el Tag
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const tag = "${{ github.event.release.tag_name }}";
            const version = tag.replace(/^v/, "");
            
            const tauriPath = "src-tauri/tauri.conf.json";
            if (fs.existsSync(tauriPath)) {
              const config = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
              config.version = version;
              
              fs.writeFileSync(tauriPath, JSON.stringify(config, null, 2));
              console.log("✓ tauri.conf.json sincronizado a la versión: " + version);
            }

            const cargoPath = "src-tauri/Cargo.toml";
            if (fs.existsSync(cargoPath)) {
              let cargoContent = fs.readFileSync(cargoPath, "utf8");
              cargoContent = cargoContent.replace(/^version\s*=\s*"[^"]*"/m, `version = "${version}"`);
              fs.writeFileSync(cargoPath, cargoContent);
              console.log("✓ Cargo.toml sincronizado a la versión: " + version);
            }
          '

      - name: Configurar Rust y el Target de compilación
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Instalar dependencias de Linux (Gtk / WebKit)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias del Frontend
        run: bun install

      - name: Compilar y Subir aplicación con Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.release.tag_name }}
          releaseId: ${{ github.event.release.id }}
          args: --target ${{ matrix.target }} ${{ matrix.args }}

  publish-updater:
    needs: build-tauri
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false
    steps:
      - name: Descargar archivos compilados del Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p deploy-assets
          gh release download ${{ github.event.release.tag_name }} --dir deploy-assets --repo ${{ github.repository }}

      - name: Generar y Actualizar latest.json
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          REPO_NAME: ${{ github.repository }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          
          const tag = process.env.TAG_NAME;
          const repo = process.env.REPO_NAME;
          const baseUrl = `https://github.com/${repo}/releases/download/${tag}`;
          
          const files = fs.readdirSync("deploy-assets");
          
          function getSignature(filename) {
            const sigPath = path.join("deploy-assets", `${filename}.sig`);
            if (fs.existsSync(sigPath)) {
              return fs.readFileSync(sigPath, "utf8").trim();
            }
            return null;
          }

          function identifyPlatform(file) {
            if (file.endsWith(".sig")) return null;
            const f = file.toLowerCase();
            
            if (f.endsWith(".zip")) {
              if (f.includes("arm64") || f.includes("aarch64")) return "windows-aarch64";
              return "windows-x86_64"; 
            }
            if (f.endsWith(".tar.gz") && !f.includes("appimage")) {
              if (f.includes("arm64") || f.includes("aarch64") || f.includes("silicon")) return "darwin-aarch64";
              return "darwin-x86_64";
            }
            if (f.endsWith(".appimage.tar.gz") || (f.endsWith(".tar.gz") && f.includes("appimage"))) {
              return "linux-x86_64";
            }
            
            return null;
          }
          
          const latestJson = {
            version: tag,
            notes: process.env.RELEASE_NOTES || "Nueva actualización disponible.",
            pub_date: new Date().toISOString(),
            platforms: {}
          };
          
          files.forEach(file => {
            const platform = identifyPlatform(file);
            if (platform) {
              const sig = getSignature(file);
              if (sig) {
                latestJson.platforms[platform] = {
                  signature: sig,
                  url: `${baseUrl}/${file}`
                };
              } else {
                console.warn(`No se encontró firma para: ${file}`);
              }
            }
          });
          
          fs.writeFileSync("latest.json", JSON.stringify(latestJson, null, 2));
          console.log("Archivo latest.json generado con éxito:\n", JSON.stringify(latestJson, null, 2));
          '

      - name: Desplegar latest.json en la rama gh-pages
        run: |
          git clone --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages-repo
          cp latest.json gh-pages-repo/latest.json
          cd gh-pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Actualizar updater endpoint para la versión ${{ github.event.release.tag_name }}"
          git push origin gh-pages