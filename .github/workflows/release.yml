name: "Compilar y publicar releases de ADB App"

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: "--bundles deb,appimage,updater"
            name: "linux-x64"

          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--bundles dmg,updater"
            name: "macos-x64"

          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--bundles dmg,updater"
            name: "macos-arm64"

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis,updater"
            name: "windows-x64"

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            args: "--bundles nsis,updater"
            name: "windows-arm64"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      - name: Sincronizar versiones
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          
          # Actualizar archivos de versión rápidamente
          node -e '
            const fs = require("fs");
            const version = "'"$VERSION"'";
            
            // package.json
            let pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = version;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            
            // tauri.conf.json
            let tauriConf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            tauriConf.version = version;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(tauriConf, null, 2) + "\n");
            
            // Cargo.toml
            let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            cargo = cargo.replace(/^version\s*=\s*"[^"]*"/m, `version = "${version}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);
          '

      - name: Configurar Rust y el Target de compilación
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cachear dependencias de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Instalar dependencias de Linux (Gtk / WebKit)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias del Frontend
        run: bun install

      - name: Compilar y Subir aplicación con Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.event.release.tag_name }}
          releaseId: ${{ github.event.release.id }}
          args: --target ${{ matrix.target }} ${{ matrix.args }}
          updaterJsonPreferNsis: true

      - name: Preparar configuración para Microsoft Store (Solo Windows)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            let tauriConf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            tauriConf.bundle.windows = tauriConf.bundle.windows || {};
            tauriConf.bundle.windows.webviewInstallMode = { type: "offlineInstaller" };
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(tauriConf, null, 2) + "\n");
          '

      - name: Compilar versión Microsoft Store (Solo Windows)
        if: startsWith(matrix.os, 'windows')
        run: bun run tauri build --bundles nsis --target ${{ matrix.target }}

      - name: Renombrar y Subir versión Store
        if: startsWith(matrix.os, 'windows')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $exe = Get-ChildItem -Path "src-tauri\target\${{ matrix.target }}\release\bundle\nsis\*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          
          # matrix.name here is like "windows-x64", so we extract the arch:
          $arch = if ("${{ matrix.name }}" -like "*arm64*") { "arm64" } else { "x64" }
          
          Rename-Item -Path $exe.FullName -NewName "ADB-App-MicrosoftStore-Version-$arch.exe"
          gh release upload $env:TAG "src-tauri\target\${{ matrix.target }}\release\bundle\nsis\ADB-App-MicrosoftStore-Version-$arch.exe" --clobber

  publish-updater:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      - name: Mover archivos del actualizador a un Release paralelo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          UPDATER_TAG="${TAG}-updater"
          
          echo "Creando release $UPDATER_TAG..."
          gh release create "$UPDATER_TAG" --prerelease --title "Updater files for $TAG" --notes "Archivos internos del actualizador. Descarga la aplicación principal desde el release $TAG." || true
          
          mkdir -p updater-assets
          echo "Descargando archivos de actualización del release principal..."
          gh release download "$TAG" --pattern "*.zip" --pattern "*.sig" --pattern "*.tar.gz" --dir updater-assets || true
          
          if [ "$(ls -A updater-assets)" ]; then
            echo "Subiendo archivos al release del actualizador..."
            gh release upload "$UPDATER_TAG" updater-assets/* --clobber
            
            echo "Eliminando archivos del release principal..."
            for file in updater-assets/*; do
              filename=$(basename "$file")
              gh release delete-asset "$TAG" "$filename" -y || true
            done
          else
            echo "No se encontraron archivos para mover."
          fi

      - name: Generar latest.json y actualizar Release
        uses: actions/github-script@v9
        with:
          script: |
            const { repo, owner } = context.repo;
            const mainTag = context.payload.release.tag_name;
            const updaterTag = `${mainTag}-updater`;
            
            // 1. Obtener Release Principal
            const mainRelease = await github.rest.repos.getReleaseByTag({
              owner, repo, tag: mainTag
            });
            
            // 2. Obtener Release del Actualizador
            let updaterRelease;
            try {
              updaterRelease = await github.rest.repos.getReleaseByTag({
                owner, repo, tag: updaterTag
              });
            } catch (e) {
              console.warn("No se encontró el release de updaters, se usará el principal");
              updaterRelease = mainRelease;
            }

            const version = mainRelease.data.tag_name.replace(/^v/, '');
            
            // 3. Pre-fetch de las firmas desde el updaterRelease
            const signatureCache = new Map();
            for (const asset of updaterRelease.data.assets) {
              if (asset.name.endsWith('.sig')) {
                const sigResponse = await fetch(asset.browser_download_url);
                if (sigResponse.ok) {
                  signatureCache.set(asset.name, (await sigResponse.text()).trim());
                } else {
                  console.warn(`Error al descargar firma: ${asset.name}`);
                }
              }
            }

            const platforms = {};
            const downloads = { Windows: [], macOS: [], Linux: [] };

            // 4. Analizar descargas principales (Main Release)
            for (const asset of mainRelease.data.assets) {
              const lowerName = asset.name.toLowerCase();
              if (lowerName.endsWith('.exe')) {
                const isArm = lowerName.includes('arm64') || lowerName.includes('aarch64');
                const isStore = lowerName.includes('microsoftstore-version');
                const label = isStore ? `Store Version (Offline)` : (isArm ? `ARM64` : `x64`);
                downloads.Windows.push(`[${label} (.exe)](${asset.browser_download_url})`);
              } else if (lowerName.endsWith('.dmg')) {
                const isArm = lowerName.includes('arm64') || lowerName.includes('aarch64');
                downloads.macOS.push(`[${isArm ? 'Apple Silicon' : 'Intel'} (.dmg)](${asset.browser_download_url})`);
              } else if (lowerName.endsWith('.appimage')) {
                downloads.Linux.push(`[x64 (.AppImage)](${asset.browser_download_url})`);
              } else if (lowerName.endsWith('.deb')) {
                downloads.Linux.push(`[x64 (.deb)](${asset.browser_download_url})`);
              }
            }

            // 5. Analizar updaters (Updater Release)
            for (const asset of updaterRelease.data.assets) {
              if (asset.name.endsWith('.sig')) continue;
              const lowerName = asset.name.toLowerCase();
              
              let platformKey = null;
              if (lowerName.endsWith('.zip')) { 
                platformKey = (lowerName.includes('arm64') || lowerName.includes('aarch64')) ? 'windows-aarch64' : 'windows-x86_64';
              } else if (lowerName.endsWith('.tar.gz')) {
                if (lowerName.includes('.app.tar.gz')) {
                  platformKey = (lowerName.includes('arm64') || lowerName.includes('aarch64')) ? 'darwin-aarch64' : 'darwin-x86_64';
                } else if (lowerName.includes('.appimage.tar.gz')) {
                  platformKey = 'linux-x86_64';
                }
              }

              if (platformKey) {
                const sigName = asset.name + '.sig';
                let signature = signatureCache.get(sigName) || "";
                
                if (!signature) {
                  core.warning(`No se encontró la firma (.sig) para el updater: ${asset.name}`);
                }

                platforms[platformKey] = {
                  signature,
                  url: asset.browser_download_url
                };
              }
            }

            const latestJson = {
              version,
              notes: mainRelease.data.body || "Nueva actualización disponible.",
              pub_date: new Date().toISOString(),
              platforms
            };

            const fs = require('fs');
            fs.writeFileSync('latest.json', JSON.stringify(latestJson, null, 2));

            // 4. Generar lista de descargas y actualizar el Release
            let tableMarkdown = "| OS | Downloads |\n|---|---|\n";
            for (const os of ['Windows', 'macOS', 'Linux']) {
              if (downloads[os].length > 0) {
                tableMarkdown += `| **${os}** | ${downloads[os].join('<br>')} |\n`;
              }
            }

            tableMarkdown += '\n> [!WARNING]\n';
            tableMarkdown += '> **⚠️ macOS Apple Silicon (M1+ or A18+) Users:**\n';
            tableMarkdown += '> If macOS says the app is "damaged" and cannot be opened, it is because macOS Gatekeeper blocks unsigned internet downloads. To fix this, move the app to your Applications folder, open **Terminal**, and run:\n';
            tableMarkdown += '> `xattr -cr "/Applications/ADB App.app"`\n\n';
            tableMarkdown += '---\n\n';

            const originalBody = mainRelease.data.body || '';
            const newBody = originalBody.includes('| OS | Downloads |') 
              ? originalBody 
              : tableMarkdown + originalBody;

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: mainRelease.data.id,
              body: newBody
            });
            
      - name: Desplegar latest.json en la rama gh-pages
        run: |
          git clone --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages-repo
          cp latest.json gh-pages-repo/latest.json
          cd gh-pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Actualizar updater endpoint para la versión ${{ github.event.release.tag_name }}"
          git push origin gh-pages