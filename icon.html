<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADB App Logo</title>
  <style>
    :root {
      --icon-color: #34a853;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
    }

    svg {
      width: 96vmin;
      height: 96vmin;
      overflow: visible;
      color: var(--icon-color);
    }

    .logo-fill {
      fill: currentColor;
      stroke: currentColor;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cute ghost app logo">
    <defs>
      <mask id="face-cutouts">
        <rect width="100" height="100" fill="white" />

        <!-- Ojos -->
        <circle cx="36" cy="40" r="4.2" fill="black" />
        <circle cx="64" cy="40" r="4.2" fill="black" />

        <!-- Sonrisa -->
        <path
          d="M44.5 54.5 C47.5 56.4 52.5 56.4 55.5 54.5"
          fill="none"
          stroke="black"
          stroke-width="2.9"
          stroke-linecap="round"
        />
      </mask>
    </defs>

    <g class="logo-fill" mask="url(#face-cutouts)">
      <!-- Palitos -->
      <path d="M36.5 27 L30.5 14.5" fill="none" stroke-width="5.4" stroke-linecap="round" />
      <path d="M63.5 27 L69.5 14.5" fill="none" stroke-width="5.4" stroke-linecap="round" />

      <!-- Objeto -->
      <path d="
        M50 21
        C31.5 21 20.5 33.5 19.5 52
        C19 61.5 17.3 69.7 14.8 76.8
        C12.9 82.2 16.4 86.7 22.1 86.1
        C28 85.5 30.6 80.8 36.6 80.8
        C42.4 80.8 44.1 86.5 50 86.5
        C55.9 86.5 57.6 80.8 63.4 80.8
        C69.4 80.8 72 85.5 77.9 86.1
        C83.6 86.7 87.1 82.2 85.2 76.8
        C82.7 69.7 81 61.5 80.5 52
        C79.5 33.5 68.5 21 50 21
        Z
      " />
    </g>
  </svg>
</body>
</html>
